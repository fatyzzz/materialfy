# Release on a v* tag: the same builds as build.yml, published as a GitHub Release.
# The app checks this repo's latest release and installs the matching asset, verified against SHA256SUMS.txt;
# asset names must stay stable (see crates/sf-services/src/update).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: materialfy-*
          path: dist
          merge-multiple: true

      - name: Release files and checksums
        run: |
          ls -la dist
          ls dist/*.apk >/dev/null 2>&1 || { echo "::error::no release-signed APK (check ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASS)"; exit 1; }
          cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: Materialfy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # Only the APK signed with the release key (secrets ANDROID_KEYSTORE_BASE64/_PASS) is published:
          # without the key the build uploads android-arm64-debugsigned instead and the release fails here.
          # Desktop builds (repository variable DESKTOP_BUILDS=true) are attached when present.
          fail_on_unmatched_files: false
          files: |
            dist/*.apk
            dist/*-Setup.exe
            dist/*-portable.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/SHA256SUMS.txt
