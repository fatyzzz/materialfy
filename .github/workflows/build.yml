# Builds, tests and packages Materialfy on every supported platform.
# Runs on pushes to main, on pull requests, manually (Actions -> Build -> Run workflow) and is called
# by release.yml (workflow_call) for tagged releases. Every platform job is required.
# This fork ships only the Android APK: the desktop jobs (Windows, Linux, macOS) are skipped unless the
# repository variable DESKTOP_BUILDS is 'true'.
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Build version (tag v1.2.3 or 1.2.3); empty means the version from Cargo.toml"
        type: string
        required: false
        default: ""

# A newer push to the same pull request cancels the run in progress. Pushes to a branch are left
# alone: the build on main is what the badge in the README reports, so cancelling it means the
# badge only ever shows the state of a run that never finished.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  QT_VERSION: "6.12.0"
  QT_ADDONS: "qtshadertools qtimageformats"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -z "$v" ]; then
            v="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); split($0,a,"="); print a[2]; exit}' Cargo.toml)"
          fi
          [ -n "$v" ] || { echo "could not determine the version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  windows:
    name: Windows x86_64
    needs: meta
    if: vars.DESKTOP_BUILDS == 'true'
    # Own runner for pushes and tags; pull requests (possibly from forks) never reach it.
    # Set the repository variable USE_SELF_HOSTED=false to build in the cloud while that machine is off.
    runs-on: ${{ (github.event_name != 'pull_request' && vars.USE_SELF_HOSTED != 'false' && (github.repository == 'fatyzzz/materialfy' || vars.USE_SELF_HOSTED == 'true')) && fromJSON('["self-hosted","Windows","materialfy"]') || 'windows-latest' }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\Qt\${{ env.QT_VERSION }}\msvc2022_64
          key: qt-${{ env.QT_VERSION }}-windows-x86_64-${{ hashFiles('.github/scripts/install_qt.py') }}

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: pwsh
        run: >
          python .github/scripts/install_qt.py --host windows --version $env:QT_VERSION
          --addons $($env:QT_ADDONS -split ' ') --out "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64" --github

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $paths = @("C:\Program Files (x86)\Inno Setup 6", "C:\Program Files\Inno Setup 6", "$env:LOCALAPPDATA\Programs\Inno Setup 6")
          if (-not ($paths | Where-Object { Test-Path "$_\ISCC.exe" })) {
            choco install innosetup -y --no-progress
          }
          foreach ($p in $paths) { if (Test-Path "$p\ISCC.exe") { $p | Out-File -Append $env:GITHUB_PATH; break } }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-qt-${{ env.QT_VERSION }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: cargo test
        shell: pwsh
        run: cargo test --locked --release --workspace

      - name: Build, windeployqt, installer
        shell: pwsh
        run: ./build_windows.ps1 -QtDir $env:QTDIR -Version $env:VERSION -Portable

      - name: Smoke test (window screenshot)
        # informational: a failed launch check must not hold back the packages
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "target\dist\materialfy\materialfy.exe"
          $shot = Join-Path $env:RUNNER_TEMP "shot.png"
          $p = Start-Process $exe -ArgumentList "--new-instance", "--offline", "--screenshot", $shot, "--delay", "3000" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "the app did not exit within 90 s" }
          if (-not (Test-Path $shot) -or (Get-Item $shot).Length -eq 0) { throw "no window screenshot" }

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows-x86_64
          path: ${{ runner.temp }}/shot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: materialfy-windows-x86_64
          path: |
            target/dist/Materialfy-*-Setup.exe
            target/dist/Materialfy-*-portable.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: meta
    if: vars.DESKTOP_BUILDS == 'true'
    runs-on: ${{ matrix.runner }}
    # x86_64 is built inside Ubuntu 22.04, the oldest LTS still in standard support: the binary and the system
    # libraries linuxdeploy bundles then need glibc 2.35 and GCC 11's libstdc++, so the AppImage runs on any
    # current distribution (built on the runner's own 24.04 it needed glibc 2.39 and failed the AppImage
    # catalog test); Qt 6.12 for x86_64 needs glibc 2.34. Qt's arm64 build is made on Ubuntu 24.04, so its
    # qmake doesn't even start on 22.04: aarch64 stays on the 24.04 runner itself. A container job can't use
    # the WSL runner, so x86_64 is in the cloud too (free for a public repository).
    container: ${{ matrix.container }}
    # in a container `run` steps default to sh (dash); the steps use bash syntax
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            container: ubuntu:22.04
            qt_host: linux
            qt_dir: gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: ''
            qt_host: linux_arm64
            qt_dir: gcc_arm64
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      # The container starts bare and as root (no sudo there; the runner itself needs it): git (checkout,
      # version stamp), curl and python3 (Qt installer, rustup) come first. libasound2-dev (cpal), libpulse-dev
      # (librespot pulseaudio backend), xcb/GL for Qt and linuxdeploy, xvfb + mesa for the smoke test.
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 xz-utils unzip \
            build-essential pkg-config lld p7zip-full patchelf file desktop-file-utils \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libgl-dev libegl-dev libopengl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype-dev libwayland-dev \
            libxcb1-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libxcb-xinerama0 \
            libxcb-glx0 libx11-xcb1 \
            xvfb xauth libgl1-mesa-dri libegl-mesa0 libglx-mesa0

      - uses: actions/checkout@v7

      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}
          key: qt-${{ env.QT_VERSION }}-linux-${{ matrix.arch }}-${{ hashFiles('.github/scripts/install_qt.py') }}

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          read -ra addons <<< "$QT_ADDONS"
          python3 .github/scripts/install_qt.py --host ${{ matrix.qt_host }} --version "$QT_VERSION" \
            --addons "${addons[@]}" --out "$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix.qt_dir }}" --github

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}-qt-${{ env.QT_VERSION }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: cargo build
        run: cargo build --locked --release -p materialfy

      - name: cargo test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export LD_LIBRARY_PATH="$QTDIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --locked --release --workspace

      - name: Package AppImage and tar.gz
        run: bash .github/scripts/package_linux.sh "$VERSION"

      - name: Smoke test (window screenshot)
        # informational: a failed launch check must not hold back the packages
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 90 target/dist/AppDir/AppRun --screenshot "$RUNNER_TEMP/shot.png" --offline --new-instance --delay 3000
          test -s "$RUNNER_TEMP/shot.png"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/shot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: materialfy-linux-${{ matrix.arch }}
          path: |
            target/dist/*.AppImage
            target/dist/*.tar.gz
          if-no-files-found: error

  player-regressions:
    name: Player and DJ regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libasound2-dev libpulse-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: player-tests
      - run: cargo test --locked -p md3-model --lib && cargo test --locked -p sf-player --lib

  qml-regressions:
    name: QML interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python -m pip install PySide6==6.12.0
      - name: Queue, DJ, covers, gestures and typography
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/qml/queue_view_regression.py
          python tests/qml/dj_regression.py
          python tests/qml/player_motion_regression.py
          python tests/qml/cover_transition_regression.py
          python tests/qml/font_scale_regression.py

  android:
    name: Android arm64
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends p7zip-full lld

      # Qt for Android needs a desktop Qt of the same version for its tools (moc, rcc, androiddeployqt)
      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
            ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
          key: qt-${{ env.QT_VERSION }}-android-${{ hashFiles('.github/scripts/install_qt.py') }}

      - name: Install Qt ${{ env.QT_VERSION }} (host and Android)
        run: |
          read -ra addons <<< "$QT_ADDONS"
          python3 .github/scripts/install_qt.py --host linux --version "$QT_VERSION" \
            --addons "${addons[@]}" --out "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
          python3 .github/scripts/install_qt.py --host android --version "$QT_VERSION" \
            --addons "${addons[@]}" --out "$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-qt-${{ env.QT_VERSION }}
          save-if: ${{ github.event_name != 'pull_request' }}

      # Release key from the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASS secrets: in-app updates install only
      # over an APK signed with the same key. Without them the APK is signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEY_ALIAS=${{ vars.ANDROID_KEY_ALIAS || 'materialfy' }}"
              echo "ANDROID_KEYSTORE_PASS=$KEYSTORE_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is debug-signed and can't update an installed release"
          fi

      - name: Build APK
        run: |
          export QT_ANDROID="$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a" QT_HOST="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
          export ANDROID_SDK_ROOT="$ANDROID_HOME" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash android/build_apk.sh --release
          mkdir -p target/dist
          if [ -n "${ANDROID_KEYSTORE:-}" ]; then
            # the updater picks the asset by its "-arm64-v8a.apk" suffix
            cp target/android/Materialfy-*-arm64-v8a.apk "target/dist/Materialfy-$VERSION-arm64-v8a.apk"
          else
            # debug-signed: not for a release (it couldn't update an installed signed APK)
            cp "$(ls target/android/Materialfy-*-arm64-v8a*.apk | head -1)" "target/dist/Materialfy-$VERSION-arm64-v8a-debugsigned.apk"
          fi

      # release.yml takes materialfy-* artifacts: only a release-signed APK goes there
      - uses: actions/upload-artifact@v7
        if: env.ANDROID_KEYSTORE != ''
        with:
          name: materialfy-android-arm64
          path: target/dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: env.ANDROID_KEYSTORE == ''
        with:
          name: android-arm64-debugsigned
          path: target/dist/*.apk
          if-no-files-found: error

  macos:
    # One Apple silicon runner builds both: arm64 natively and x86_64 cross-compiled (Qt for macOS is
    # universal). The two dmg names stay per architecture because the in-app updater picks them by name.
    name: macOS arm64 + x86_64
    needs: meta
    if: vars.DESKTOP_BUILDS == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7

      # 7-Zip extracts the Qt archives in install_qt.py
      - name: Install 7-Zip
        run: brew install sevenzip

      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/macos
          key: qt-${{ env.QT_VERSION }}-macos-universal-${{ hashFiles('.github/scripts/install_qt.py') }}

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          read -ra addons <<< "$QT_ADDONS"
          python3 .github/scripts/install_qt.py --host mac --version "$QT_VERSION"             --addons "${addons[@]}" --out "$RUNNER_TEMP/Qt/$QT_VERSION/macos" --github

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal-qt-${{ env.QT_VERSION }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: cargo build (arm64)
        run: cargo build --locked --release -p materialfy

      - name: cargo build (x86_64)
        run: cargo build --locked --release -p materialfy --target x86_64-apple-darwin

      - name: cargo test
        env:
          QT_QPA_PLATFORM: offscreen
        run: cargo test --locked --release --workspace

      # x86_64 first, so the Materialfy.app left behind for the smoke test is the native arm64 one
      - name: Package dmg (x86_64)
        env:
          MATERIALFY_ARCH: x86_64
          MATERIALFY_EXE: ${{ github.workspace }}/target/x86_64-apple-darwin/release/materialfy
        run: bash .github/scripts/package_macos.sh "$VERSION"

      - name: Package dmg (arm64)
        env:
          MATERIALFY_ARCH: arm64
        run: bash .github/scripts/package_macos.sh "$VERSION"

      - name: Smoke test (window screenshot)
        # informational: a failed launch check must not hold back the packages
        continue-on-error: true
        run: |
          # macOS has no coreutils timeout; the perl alarm kills the app if it hangs
          perl -e 'alarm 90; exec @ARGV' target/dist/Materialfy.app/Contents/MacOS/materialfy             --screenshot "$RUNNER_TEMP/shot.png" --offline --new-instance --delay 3000
          test -s "$RUNNER_TEMP/shot.png"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-macos
          path: ${{ runner.temp }}/shot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: materialfy-macos
          path: target/dist/*.dmg
          if-no-files-found: error
