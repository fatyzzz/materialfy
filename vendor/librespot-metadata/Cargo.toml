[package]
name = "librespot-metadata"
version = "0.8.0"
rust-version = "1.85"
authors = ["Paul Lietar <paul@lietar.net>"]
license = "MIT"
description = "The metadata logic for librespot"
repository = "https://github.com/librespot-org/librespot"
edition = "2024"

[features]
# Refer to the workspace Cargo.toml for the list of features
default = ["native-tls"]

# TLS backend propagation
native-tls = ["librespot-core/native-tls"]
rustls-tls-native-roots = ["librespot-core/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["librespot-core/rustls-tls-webpki-roots"]

[dependencies]
librespot-core = { version = "0.8.0", default-features = false }
librespot-protocol = { version = "0.8.0", default-features = false }

async-trait = "0.1"
bytes = "1"
log = "0.4"
protobuf = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
uuid = { version = "1", default-features = false }

