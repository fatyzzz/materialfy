[package]
name = "sf-player"
description = "Плеер Spotify: librespot (Session/Spirc/Player), свой sink на fastframe-audio, Connect, очередь, оптимистичный снимок"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mf-i18n.workspace = true
md3-model.workspace = true
sf-auth.workspace = true
sf-api.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
log.workspace = true
tracing.workspace = true
fastrand.workspace = true
rand.workspace = true
jiff.workspace = true
sha1.workspace = true
hex.workspace = true
base64.workspace = true
protobuf.workspace = true
percent-encoding.workspace = true
librespot-core.workspace = true
librespot-playback.workspace = true
librespot-connect.workspace = true
librespot-metadata.workspace = true
librespot-protocol.workspace = true
rodio.workspace = true
fastframe-audio.workspace = true
mdns-sd.workspace = true
aes.workspace = true
ctr.workspace = true
hmac.workspace = true
pbkdf2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_Media_Audio"] }

[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
librespot-playback = { workspace = true, features = ["pulseaudio-backend"] }

[dev-dependencies]
http.workspace = true
